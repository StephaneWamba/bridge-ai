<svg width="240" height="80" viewBox="0 0 240 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bridge structure (larger, more detailed) -->
  <g transform="translate(20, 20)">
    <!-- Main bridge path -->
    <path d="M10 40 L25 25 L40 40 L55 25 L70 40" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Support pillars -->
    <line x1="10" y1="40" x2="10" y2="50" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="40" y1="40" x2="40" y2="50" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="70" y1="40" x2="70" y2="50" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Connection nodes -->
    <circle cx="25" cy="25" r="3" fill="currentColor"/>
    <circle cx="55" cy="25" r="3" fill="currentColor"/>
    <circle cx="40" cy="40" r="5" fill="currentColor"/>
    
    <!-- Data flow lines -->
    <path d="M25 25 L32 32 L40 40" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
    <path d="M55 25 L48 32 L40 40" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
  </g>
  
  <!-- Text: BridgeAI -->
  <text x="100" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="currentColor" letter-spacing="-0.8">
    BridgeAI
  </text>
  
  <!-- Tagline (optional, subtle) -->
  <text x="100" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="currentColor" opacity="0.6" letter-spacing="0.5">
    AI Integration Copilot
  </text>
</svg>




